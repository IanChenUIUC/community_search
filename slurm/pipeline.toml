coldwarm = "${root}/src/cold-warm"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/cold-warm.py"

[recipe.pyvib-query]
params = { dataset = "training_networks" }
deps   = ["csr-format(dataset=${dataset})", "icebug-core-decomp(dataset=${dataset})"]

dir    = "${output}/${dataset}/pyvib-query"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
