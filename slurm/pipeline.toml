[defaults.slurm]
cpus = 16
mem  = "128GB"
time = "4:00:00"
partition = "secondary"

[defaults]
root   = "/u/ianchen3/community_search"
input  = "${root}/input"
output = "${root}/output"

all_networks      = ["abm14", "bitcoin", "cen", "dbpedia_link", "friendster",
                     "livejournal", "microsoft_concept", "twitter_social", "wikipedia_link"]
testing_networks  = ["bitcoin", "dbpedia_link", "friendster", "livejournal",
                     "microsoft_concept", "twitter_social", "wikipedia_link"]
training_networks = ["abm14", "cen"]

threadcounts = [1, 2, 4, 8, 16, 32, 48, 64]

util     = "${root}/src/utilities"
icebug   = "${root}/src/ours-icebug-commsearch"
pycs     = "${root}/src/ours-python-commsearch"
genq     = "${root}/src/gen-query"
nkit     = "${root}/src/networkit-core-decomposition"
gbbs     = "${root}/src/gbbs-core-decomposition"
gullo    = "${root}/src/gullo-shellstruct"

mytime = "uv run --project ${util} ${util}/mytime.py"

ld_icebug = """
export LD_LIBRARY_PATH=$(
    ${icebug}/.venv/bin/python -c "import pyarrow; print(pyarrow.get_library_dirs()[0])"
  ):$LD_LIBRARY_PATH"""
ld_pycs = """
export LD_LIBRARY_PATH=$(
    ${pycs}/.venv/bin/python -c "import pyarrow; print(pyarrow.get_library_dirs()[0])"
  ):$LD_LIBRARY_PATH"""

[recipe.build]
stdout = "${output}/build.out"
stderr = "${output}/build.err"
timing = "${output}/build.resources"

command = """
mkdir -p ${input}
mkdir -p ${output}
${mytime} -o ${timing} -- bash -c "
  cd ${gbbs} && bazel build //...
  cd ${root}/src/ucrparlay-core-decomposition/KCore && make
  cd ${root}/src/pkc-core-decomposition && make
  cd ${root}/src/csk-commsearch && make
  cd ${gullo} && mvn compile
  cd ${util} && uv sync
  cd ${nkit} && uv sync
  cd ${icebug} && uv sync
  cd ${pycs} && uv sync
  cd ${genq} && uv sync
  cd ${root}/src/lbug-core-decomposition && uv sync
" 1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.gbbs-format]
array  = true
slurm  = { mem = "256GB" }
params = { dataset = "all_networks" }
deps   = ["build"]

dir    = "${output}/${dataset}/gbbs-format"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
adj    = "${input}/${dataset}.gbbs.adj"
bin    = "${input}/${dataset}.gbbs.bin"

command = """
mkdir -p ${dir}
vmtouch -t ${input}/${dataset}.csv
${mytime} -o ${timing} -- \
  ${util}/csv2gbbs.sh  \
    ${input}/${dataset}.csv \
    ${adj} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
${mytime} -a -o ${timing} -- \
  ${gbbs}/bazel-bin/utils/converter -s -enc binary \
    -o ${bin} \
    ${adj} \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr} >&2)
"""

[recipe.pkc-format]
array  = true
params = { dataset = "all_networks" }
deps   = ["build"]

dir    = "${output}/${dataset}/pkc-format"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
adj    = "${input}/${dataset}.pkc.adj"

command = """
mkdir -p ${dir}
vmtouch -t ${input}/${dataset}.csv
${mytime} -o ${timing} -- \
  ${util}/csv2pkc.sh  \
    ${input}/${dataset}.csv \
    ${adj} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.nk-format]
array  = true
params = { dataset = "training_networks" }
deps   = ["build"]

dir    = "${output}/${dataset}/nk-format"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
bin    = "${input}/${dataset}.nk.bin"

command = """
mkdir -p ${dir}
vmtouch -t ${input}/${dataset}.csv
${mytime} -o ${timing} -- \
  ${nkit}/.venv/bin/python ${nkit}/csv2nk.py \
    --edgelist ${input}/${dataset}.csv \
    --output ${bin} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.csr-format]
array  = true
params = { dataset = "all_networks" }
deps   = ["build"]
slurm  = { cpus = 1 }

dir       = "${output}/${dataset}/csr-format"
stdout    = "${dir}/stdout.txt"
stderr    = "${dir}/stderr.txt"
timing    = "${dir}/timing.txt"
indptr    = "${input}/${dataset}.indptr.feather"
indptr_pq = "${input}/${dataset}.indptr.parquet"
indices   = "${input}/${dataset}.indices.feather"
indices32 = "${input}/${dataset}.indices32.feather"

command = """
mkdir -p ${dir}
vmtouch -t ${input}/${dataset}.csv
${mytime} -o ${timing} -- \
  ${util}/.venv/bin/python ${util}/csv2csr.py  \
    ${input}/${dataset}.csv \
    ${input}/${dataset} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
${mytime} -a -o ${timing} -- \
  ${util}/.venv/bin/python ${util}/pq2pf.py -w 32 \
    ${input}/${dataset}.indices.parquet \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr} >&2)
mv ${indices} ${indices32}
${mytime} -a -o ${timing} -- \
  ${util}/.venv/bin/python ${util}/pq2pf.py \
    ${input}/${dataset}.indptr.parquet \
    ${input}/${dataset}.indices.parquet \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr} >&2)
"""

[recipe.lbug-format]
array  = true
params = { dataset = "training_networks" }
deps   = ["build"]
slurm  = { cpus = 1 }

dir     = "${output}/${dataset}/lbug-format"
stdout  = "${dir}/stdout.txt"
stderr  = "${dir}/stderr.txt"
timing  = "${dir}/timing.txt"
indptr  = "${input}/${dataset}.lbug.indptr.parquet"
indices = "${input}/${dataset}.lbug.indices.parquet"

command = """
mkdir -p ${dir}
vmtouch -t ${input}/${dataset}.csv
${mytime} -o ${timing} -- \
  ${util}/.venv/bin/python ${util}/csv2csr.py \
    ${input}/${dataset}.csv \
    ${input}/${dataset}.lbug \
    --no-symmetrize \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.traincd-gbbs-core-decomp]
array  = true
params = { dataset = "training_networks" }
deps   = ["gbbs-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/traincd-gbbs-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
cores  = "${dir}/cores.csv"

command = """
mkdir -p ${dir}
vmtouch -t ${gbbs-format.bin}
export PARLAY_NUM_THREADS=${slurm.cpus}
${mytime} -o ${timing} -- \
  ${gbbs}/bazel-bin/benchmarks/KCore/JulienneDBS17/KCore_main -s -b -rounds 1 \
    -o ${cores} \
    ${gbbs-format.bin} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.traincd-ucr-core-decomp]
array  = true
params = { dataset = "training_networks" }
deps   = ["gbbs-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/traincd-ucr-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
cores  = "${dir}/cores.csv"
ucr    = "${root}/src/ucrparlay-core-decomposition"

command = """
mkdir -p ${dir}
vmtouch -t ${gbbs-format.bin}
export PARLAY_NUM_THREADS=${slurm.cpus}
${mytime} -o ${timing} -- \
  ${ucr}/KCore/kcore -s \
    -i ${gbbs-format.bin} \
    -o ${cores} \
    -l ${stdout} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.traincd-pkc-core-decomp]
array  = true
params = { dataset = "training_networks" }
deps   = ["pkc-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/traincd-pkc-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
cores  = "${dir}/cores.csv"
pkc    = "${root}/src/pkc-core-decomposition"

command = """
mkdir -p ${dir}
vmtouch -t ${pkc-format.adj}
export OMP_NUM_THREADS=${slurm.cpus}
${mytime} -o ${timing} -- \
  ${pkc}/pkc.exe \
    ${pkc-format.adj} \
    ${cores} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.traincd-lbug-core-decomp]
