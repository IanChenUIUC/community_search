[recipe.gbbs-core-decomp]
array   = true
# params  = { dataset = ["abm14", "bitcoin", "cen", "dbpedia_link", "friendster", "livejournal", "microsoft_concept", "twitter_social", "wikipedia_link"] }
params  = { dataset = ["abm14", "cen"] }
deps    = ["gbbs-format(dataset=${dataset})"]
slurm   = { cpus = 16, exclusive = true }

stdout  = "${output}/${dataset}/gbbs-core-decomp/stdout.txt"
stderr  = "${output}/${dataset}/gbbs-core-decomp/stderr.txt"
timing  = "${output}/${dataset}/gbbs-core-decomp/timing.txt"

command = """
mkdir -p ${output}/${dataset}/gbbs-core-decomp
export PARLAY_NUM_THREADS=${slurm.cpus}
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -o ${timing} -- \
  ${root}/src/gbbs-core-decomposition/bazel-bin/benchmarks/KCore/JulienneDBS17/KCore_main -s -b -rounds 1 \
    -o ${output}/${dataset}/gbbs-core-decomp/cores.csv \
    ${input}/${dataset}.gbbs.bin \
  1> >(tee ${stdout}) 2> >(tee ${stderr})
"""

