command = """
mkdir -p ${output}
/usr/bin/time -v -a -o ${timing} \
  ${root}/src/gbbs-core-decomposition/bazel-bin/benchmarks/KCore/JulienneDBS17/KCore_main -s -rounds 1 \
    -o ${output}/${dataset}.gbbs.cores.csv \
    ${input}/${dataset}.gbbs.adj \
  1> >(tee ${stdout}) 2> >(tee ${stderr})
"""

