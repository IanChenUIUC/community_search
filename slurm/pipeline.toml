"""

[recipe.traincs-steiner-shell]
array  = true
params = { dataset = "training_networks" }
deps   = ["csr-format(dataset=${dataset})", "traincs-genquery(dataset=${dataset})",
          "icebug-core-decomp(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/traincs"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing"
shell  = "${dir}/shell"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/traincs-steiner-shell.py"

[recipe.traincs-local]
array      = true
array_axes = ["rep", "size"]
params     = { dataset = "training_networks", rep = "traincs-genquery.reps", size = "traincs-genquery.sizes", variant = ["local", "local-upper"] }
deps       = ["csr-format(dataset=${dataset})", "traincs-genquery(dataset=${dataset})"]
slurm      = { cpus = 16 }

dir    = "${output}/${dataset}/traincs"
stdout = "${dir}/${variant}-stdout-n${size}-rep${rep}.txt"
stderr = "${dir}/${variant}-stderr-n${size}-rep${rep}.txt"
timing = "${dir}/timing"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/traincs-local.py"

[recipe.strongscaling-genquery]
array  = true
params = { dataset = "all_networks" }
deps   = ["csr-format(dataset=${dataset})"]
slurm  = { cpus = 1 }

dir       = "${output}/${dataset}/strongscaling"
stdout    = "${dir}/genquery-stdout.txt"
stderr    = "${dir}/genquery-stderr.txt"
timing    = "${dir}/genquery-timing.txt"
size      = 5
batch     = 32
nreps     = 10
querybase = "${dir}/genquery-n${size}-b${batch}-r${nreps}"

command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${genq}/.venv/bin/python ${genq}/gen_query.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${querybase} \
    -n ${size} -b ${batch} -r ${nreps} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.strongscaling-core-decomp]
array      = true
array_axes = ["dataset"]
params     = { dataset = "all_networks", threads = "threadcounts" }
deps       = ["csr-format(dataset=${dataset})"]
slurm      = { cpus = "${threads}", mem = "128GB" }

dir    = "${output}/${dataset}/strongscaling"
stdout = "${dir}/coredecomp-stdout-t${threads}.txt"
stderr = "${dir}/coredecomp-stderr-t${threads}.txt"
timing = "${dir}/coredecomp-timing-t${threads}.txt"
cores  = "${dir}/cores-t${threads}.csv"

command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${icebug}/.venv/bin/python ${icebug}/core_decomposition.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${cores} \
    --threads ${threads} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.strongscaling-shellstruct]
array      = true
array_axes = ["dataset"]
params     = { dataset = "all_networks", threads = "threadcounts" }
deps       = ["csr-format(dataset=${dataset})",
              "strongscaling-core-decomp(dataset=${dataset}, threads=${threads})"]
slurm      = { cpus = "${threads}", mem = "128GB" }

dir    = "${output}/${dataset}/strongscaling"
stdout = "${dir}/shellstruct-stdout-t${threads}.txt"
stderr = "${dir}/shellstruct-stderr-t${threads}.txt"
timing = "${dir}/shellstruct-timing-t${threads}.txt"
shell  = "${dir}/shell-t${threads}"

command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices} ${strongscaling-core-decomp.cores}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${icebug}/.venv/bin/python ${icebug}/build_shellstruct.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${shell} \
    ${strongscaling-core-decomp.cores} \
    --threads ${threads} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.strongscaling-steiner]
array      = true
array_axes = ["dataset"]
params     = { dataset = "all_networks", threads = "threadcounts" }
deps       = ["csr-format(dataset=${dataset})", "strongscaling-genquery(dataset=${dataset})",
              "strongscaling-core-decomp(dataset=${dataset}, threads=${threads})"]
slurm      = { cpus = "${threads}", mem = "128GB" }

dir    = "${output}/${dataset}/strongscaling"
stdout = "${dir}/steiner-stdout-t${threads}.txt"
stderr = "${dir}/steiner-stderr-t${threads}.txt"
timing = "${dir}/steiner-timing-t${threads}"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/strongscaling-steiner.py"
