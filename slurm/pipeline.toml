params = { dataset = "training_networks" }
deps   = ["csr-format(dataset=${dataset})"]
slurm  = { cpus = 1 }

dir    = "${output}/${dataset}/traincs"
stdout = "${dir}/genquery-stdout.txt"
stderr = "${dir}/genquery-stderr.txt"
