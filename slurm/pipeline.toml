[recipe.testing-csk]
array      = true
array_axes = ["rep", "size", "batch"]
params     = { dataset = "testing_networks", rep = "genquery.reps", size = [1], batch = "genquery.batches" }
deps       = ["genquery(dataset=${dataset})", "testing-core-decomp(dataset=${dataset})"]
slurm      = { cpus = 1 }

dir    = "${output}/${dataset}/testing-csk"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing"
