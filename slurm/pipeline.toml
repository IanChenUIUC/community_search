[recipe.icebug-shellstruct]
array  = true
params = { dataset = "all_networks" }
deps   = ["csr-format(dataset=${dataset})"]

dir    = "${output}/${dataset}/icebug-shellstruct"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
shell  = "${dir}/shell"
components = "${dir}/shell.components.feather"
tree       = "${dir}/shell.tree.feather"

command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${icebug}/.venv/bin/python ${icebug}/build_shellstruct.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${shell} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)

## query-analysis was done interactively here... via src/ours-icebug-commsearch/query_analysis.py
## shellstruct-analysis was done interactively here... via src/ours-icebug-commsearch/analyze_shellstruct.py
"""

[recipe.network-stats-extended]
array  = true
params = { dataset = "all_networks" }
deps   = ["csr-format(dataset=${dataset})", "gbbs-format(dataset=${dataset})",
          "icebug-shellstruct(dataset=${dataset})"]
slurm  = { cpus = 16, mem = "256GB" }

dir    = "${output}/${dataset}/network-stats-extended"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
stats  = "${dir}/stats.csv"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/network-stats-extended.py"

