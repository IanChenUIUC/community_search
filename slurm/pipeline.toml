command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${icebug}/.venv/bin/python ${icebug}/core_decomposition.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${cores} \
    --threads ${slurm.cpus} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.testing-steiner]
array      = true
array_axes = ["rep", "size", "batch"]
params     = { dataset = "testing_networks", rep = "genquery.reps", size = "genquery.sizes", batch = "genquery.batches" }
deps       = ["genquery(dataset=${dataset})", "csr-format(dataset=${dataset})", "testing-core-decomp(dataset=${dataset})"]

dir    = "${output}/${dataset}/testing-steiner"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing"

command = """
mkdir -p ${dir}
${ld_pycs}
vmtouch -t ${csr-format.indptr} ${csr-format.indices32}
${mytime} -o ${timing}-n${size}-b${batch}-rep${rep}.txt -- \
  ${pycs}/.venv/bin/python ${pycs}/query_steiner.py \
    ${csr-format.indptr} \
    ${csr-format.indices32} \
    ${testing-core-decomp.cores} \
    ${genquery.querybase}-n${size}-b${batch}-r20/query${rep}.csv \
    ${dir}/querytimes-n${size}-b${batch}-rep${rep}.csv \
    -t ${slurm.cpus} -b ${batch} \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr} >&2)
"""

[recipe.testing-par-shellstruct-offline]
