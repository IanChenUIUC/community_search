command = """
mkdir -p ${dir}
vmtouch -t ${lbug-format.indptr} ${lbug-format.indices}
${mytime} -o ${timing} -- \
  ${lbug}/.venv/bin/python ${lbug}/main.py \
    ${lbug-format.indptr} \
    ${lbug-format.indices} \
    ${cores} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.traincd-nk-core-decomp]
array  = true
params = { dataset = "training_networks" }
deps   = ["nk-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/traincd-nk-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
cores  = "${dir}/cores.csv"

command = """
mkdir -p ${dir}
vmtouch -t ${nk-format.bin}
${mytime} -o ${timing} -- \
  ${nkit}/.venv/bin/python ${nkit}/main.py \
    --graph ${nk-format.bin} \
    --output ${cores} \
    --threads ${slurm.cpus} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
"""

[recipe.icebug-core-decomp]
array  = true
params = { dataset = "all_networks" }
deps   = ["csr-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/icebug-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
cores  = "${dir}/cores.csv"

command = """
mkdir -p ${dir}
vmtouch -t ${csr-format.indptr} ${csr-format.indices}
${ld_icebug}
${mytime} -o ${timing} -- \
  ${icebug}/.venv/bin/python ${icebug}/core_decomposition.py \
    ${csr-format.indptr} \
    ${csr-format.indices} \
    ${cores} \
    --threads ${slurm.cpus} \
  1> >(tee ${stdout}) 2> >(tee ${stderr} >&2)
