query  = "${dir}/query.csv"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/pyvib-query.py"

[recipe.genquery]
array  = true
params = { dataset = "testing_networks" }
deps   = ["csr-format(dataset=${dataset})"]

dir       = "${output}/${dataset}/genquery"
querybase = "${output}/${dataset}/genquery"
reps      = "0..19"
sizes     = [1, 5, 10, 20]
batches   = [1, 10, 100]
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing    = "${dir}/timing"

interpreter  = "${util}/.venv/bin/python"
command_file = "cmds/genquery.py"

[recipe.testing-core-decomp]
array  = true
params = { dataset = "testing_networks" }
deps   = ["csr-format(dataset=${dataset})"]
slurm  = { cpus = 16 }

dir    = "${output}/${dataset}/testing-core-decomp"
stdout = "${dir}/stdout.txt"
stderr = "${dir}/stderr.txt"
timing = "${dir}/timing.txt"
