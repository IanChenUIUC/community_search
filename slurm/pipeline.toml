[recipe.gbbs-core-decomp]
array   = true
params  = { dataset = ["abm14", "bitcoin", "cen", "dbpedia_link", "friendster", "livejournal", "microsoft_concept", "twitter_social", "wikipedia_link"] }
deps    = ["gbbs-format(dataset=${dataset})"]

stdout  = "${output}/${dataset}.gbbs-core-decomp.out"
stderr  = "${output}/${dataset}.gbbs-core-decomp.err"
