  ${root}/src/utilities/.venv/bin/python ${root}/src/utilities/pq2pf.py -w 32 \
    ${input}/${dataset}.indices.parquet \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr})
mv ${input}/${dataset}.indices.feather ${input}/${dataset}.indices32.feather
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -a -o ${timing} -- \
  ${root}/src/utilities/.venv/bin/python ${root}/src/utilities/pq2pf.py \
    ${input}/${dataset}.indptr.parquet \
    ${input}/${dataset}.indices.parquet \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr}) 
"""

