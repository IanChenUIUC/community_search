[defaults.slurm]
cpus = 16
mem  = "128GB"
time = "4:00:00"
partition = "secondary"

[defaults]
# root = "/models/ianchen3/community_search"
root = "/u/ianchen3/community_search"
input = "${root}/input"
output = "${root}/output"

[recipe.build]
stdout  = "${output}/build.out"
stderr  = "${output}/build.err"
timing  = "${output}/build.resources"

command = """
mkdir -p ${output}
/usr/bin/time -v -a -o ${timing} bash -c "
  cd ${root}/src/gbbs-core-decomposition && bazel build //...
  cd ${root}/src/ucrparlay-core-decomposition/KCore && make
  cd ${root}/src/pkc-core-decomposition && make
  cd ${root}/src/csk-commsearch && make
  cd ${root}/src/gullo-shellstruct && mvn compile
  cd ${root}/src/utilities && uv sync --reinstall --refresh
  cd ${root}/src/lbug-core-decomposition && uv sync --reinstall --refresh
" 1> ${stdout} 2> ${stderr} 
"""

[recipe.gbbs-format]
array   = true
params  = { dataset = ["abm14", "bitcoin", "cen", "dbpedia_link", "friendster", "livejournal", "microsoft_concept", "twitter_social", "wikipedia_link"] }
deps    = ["build"]

stdout  = "${output}/${dataset}.gbbs-format.out"
stderr  = "${output}/${dataset}.gbbs-format.err"
timing  = "${output}/${dataset}.gbbs-format.resources"

command = """
mkdir -p ${output}
/usr/bin/time -v -a -o ${timing} \
  ${root}/src/utilities/csv2gbbs.sh  \
    ${input}/${dataset}.csv \
    ${input}/${dataset}.gbbs.adj \
  1> >(tee ${stdout}) 2> >(tee ${stderr})
"""

