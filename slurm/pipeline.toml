  ${root}/src/gen-query/.venv/bin/python ${root}/src/gen-query/gen_query.py \
    ${input}/${dataset}.indptr.feather \
    ${input}/${dataset}.indices.feather \
    ${output}/${dataset}/genquery-n1-b1-r20 \
    -n 1 -b 1 -r 20 \
  1> >(tee ${stdout}) 2> >(tee ${stderr})
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -o ${timing}-p2a.txt -- \
  ${root}/src/gen-query/.venv/bin/python ${root}/src/gen-query/gen_query.py \
    ${input}/${dataset}.indptr.feather \
    ${input}/${dataset}.indices.feather \
