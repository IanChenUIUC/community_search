[defaults.slurm]
cpus = 16
mem  = "128GB"
time = "4:00:00"
partition = "secondary"

[defaults]
# root = "/models/ianchen3/community_search"
root = "/u/ianchen3/community_search"
input = "${root}/input"
output = "${root}/output"

[recipe.build]
stdout  = "${output}/build.out"
stderr  = "${output}/build.err"
timing  = "${output}/build.resources"

command = """
mkdir -p ${input}
mkdir -p ${output}
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -o ${timing} -- bash -c "
  cd ${root}/src/gbbs-core-decomposition && bazel build //...
  cd ${root}/src/ucrparlay-core-decomposition/KCore && make
  cd ${root}/src/pkc-core-decomposition && make
  cd ${root}/src/csk-commsearch && make
  cd ${root}/src/gullo-shellstruct && mvn compile
  cd ${root}/src/utilities && uv sync
  cd ${root}/src/lbug-core-decomposition && uv sync
  cd ${root}/src/networkit-core-decomposition && uv sync
  cd ${root}/src/ours-icebug-commsearch && uv sync
  cd ${root}/src/ours-python-commsearch && uv sync
  cd ${root}/src/gen-query && uv sync
" 1> ${stdout} 2> ${stderr} 
"""

[recipe.gbbs-format]
array   = true
slurm   = { mem = "256GB" }
params  = { dataset = ["abm14", "bitcoin", "cen", "dbpedia_link", "friendster", "livejournal", "microsoft_concept", "twitter_social", "wikipedia_link"] }
deps    = ["build"]

stdout  = "${output}/${dataset}/gbbs-format/stdout.txt"
stderr  = "${output}/${dataset}/gbbs-format/stderr.txt"
timing  = "${output}/${dataset}/gbbs-format/timing.txt"

command = """
mkdir -p ${output}/${dataset}/gbbs-format
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -o ${timing} -- \
  ${root}/src/utilities/csv2gbbs.sh  \
    ${input}/${dataset}.csv \
    ${input}/${dataset}.gbbs.adj \
  1> >(tee ${stdout}) 2> >(tee ${stderr})
uv run --project ${root}/src/utilities ${root}/src/utilities/mytime.py -a -o ${timing} -- \
  ${root}/src/gbbs-core-decomposition/bazel-bin/utils/converter -s -enc binary \
    -o ${input}/${dataset}.gbbs.bin \
    ${input}/${dataset}.gbbs.adj \
  1> >(tee -a ${stdout}) 2> >(tee -a ${stderr})
"""

