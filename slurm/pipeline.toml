[recipe.testing-gullo-shellstruct-online]
array      = true
array_axes = ["rep", "size", "batch"]
params     = { dataset = "testing_networks", rep = "genquery.reps", size = "genquery.sizes", batch = "genquery.batches" }
deps       = ["testing-gullo-shellstruct-offline(dataset=${dataset})", "genquery(dataset=${dataset})"]
