[project]
name = "commsearch"
version = "0.1.0"
description = "K-core community search: ShellStruct index and Steiner multi-query search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.61",
    "numpy>=1.26,<2.3",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commsearch"]

[dependency-groups]
dev = ["pytest>=8"]
